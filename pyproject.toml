[project]
name = "schlieren"
version = "0.1.0"
description = "Parametric build123d models, tests, and design documents for a portable single-mirror iPhone schlieren apparatus"
readme = "README.md"
authors = [
    { name = "Fritz Mueller", email = "fritzm@fritzm.org" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.12.0",
    "ocp-vscode>=4.1.0",
    "vtk>=9.7.1",
]

[project.scripts]
camera-support = "schlieren.cli.camera_support:main"
carriage = "schlieren.cli.carriage:main"
cassette = "schlieren.cli.cassette:main"
frame = "schlieren.cli.frame:main"
light-source = "schlieren.cli.light_source:main"
mirror-cell = "schlieren.cli.mirror_cell:main"
optical-head = "schlieren.cli.optical_head:main"
rail-shoe = "schlieren.cli.rail_shoe:main"
slit-head = "schlieren.cli.slit_head:main"
build-bom-xlsx = "schlieren.cli.build_bom_xlsx:main"
build-design-doc = "schlieren.cli.build_design_doc:main"
reconcile-bom = "schlieren.cli.reconcile_bom:main"
run-tests = "schlieren.cli.run_tests:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "markdown>=3.11",
    "openpyxl>=3.1.5",
]
