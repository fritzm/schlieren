[project]
name = "schlieren"
version = "0.1.0"
description = "Parametric build123d models, tests, and design documents for a portable single-mirror iPhone schlieren apparatus"
readme = "README.md"
authors = [
    { name = "Fritz Mueller", email = "fritzm@fritzm.org" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.12.0",
    "markdown>=3.11",  # build-design-doc
    "ocp-vscode>=4.1.0",
    "openpyxl>=3.1.5",  # build-bom-xlsx, reconcile-bom
    "vtk>=9.7.1",
]

[project.scripts]
camera-support = "schlieren.cli.camera_support:main"
carriage = "schlieren.cli.carriage:main"
cassette = "schlieren.cli.cassette:main"
frame = "schlieren.cli.frame:main"
light-source = "schlieren.cli.light_source:main"
mirror-cell = "schlieren.cli.mirror_cell:main"
optical-head = "schlieren.cli.optical_head:main"
rail-shoe = "schlieren.cli.rail_shoe:main"
slit-head = "schlieren.cli.slit_head:main"
build-bom-xlsx = "schlieren.cli.build_bom_xlsx:main"
build-design-doc = "schlieren.cli.build_design_doc:main"
reconcile-bom = "schlieren.cli.reconcile_bom:main"
run-tests = "schlieren.cli.run_tests:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PIE",      # misc. flake8-pie
    "RET",      # return statements
    "RUF",      # ruff-specific
    "N",        # naming
    "A",        # builtin shadowing
    "ARG",      # unused arguments
    "ERA",      # commented-out code
    "PERF",     # performance anti-patterns
    "PL",       # pylint (errors, warnings, conventions; refactor rules are ignored below)
    "TRY",      # exception handling
    "T20",      # print
    "ICN",      # import aliases
]
ignore = [
    "E501",     # The formatter wraps code; long comments and docstrings are the author's call.
    "TRY003",   # Long messages in raised exceptions are how the checks here explain themselves.
    "RUF001", "RUF002", "RUF003",  # ×, –, °, § and similar are deliberate in dimensions and design references.
    "PLR",      # Complexity and magic-value rules do not fit parametric CAD code.
]

[tool.ruff.lint.per-file-ignores]
# The commands print their results and defer heavy imports (the renderer, the viewer) to the step that needs them.
"src/schlieren/cli/*" = ["T201", "PLC0415"]
# The Claude Code hook reports to the model by printing.
".claude/hooks/*" = ["T201"]
