<text x="69.850" y="9.000" font-size="4.6" text-anchor="start">Mirror-cell base plate: drilling layout, seen from above</text>
<text x="69.850" y="15.500" font-size="2.7" text-anchor="start">292.1 × 177.8 × 12.7 mm (11.5 × 7.0 × 1/2 in) Baltic birch. Four Ø4.5 mm through holes, countersunk 90° to Ø8.4 mm on this (top) face, for the M4 quick-release plate screws;</text>
<text x="69.850" y="19.500" font-size="2.7" text-anchor="start">four Ø8.332 mm through holes for the bracket screws. Dimensions in mm: x from the plate centerline, y from the front edge.</text>
<text x="69.850" y="24.000" font-size="2.7" text-anchor="start">Full scale when printed at 100% on 11 × 17 in: check the plate width against a rule before using the sheet as a template.</text>
<text x="69.850" y="28.500" font-size="2.7" text-anchor="start">Transfer to the sliding plate: with the plate's camera face against the underside, spot through the Ø4.5 mm holes and tap M4 × 0.7 (3.3 mm tap drill).</text>
